spring.application.name=otp-service
server.port=8080

# ---------- Datasource (PostgreSQL 17, поднимается через docker-compose) ----------
# В прод значения переопределяются через переменные окружения; дефолты — dev-значения,
# совпадающие с .env для docker-compose.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:otp_service}
spring.datasource.username=${DB_USER:otp}
spring.datasource.password=${DB_PASSWORD:otp_dev_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------- JWT ----------
otp.jwt.secret=${OTP_JWT_SECRET:dev-secret-please-change-this-must-be-long-enough-for-hs256-padding-padding}
otp.jwt.ttl-seconds=3600

# ---------- Scheduler ----------
otp.scheduler.expire-interval-ms=10000

# ---------- File channel ----------
otp.file.path=otp-codes.txt

# ---------- Logging ----------
logging.level.root=INFO
logging.level.com.vpoluboyarov.otp=DEBUG
